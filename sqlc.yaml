version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    database:
      uri: "postgres://kanban:kanban@127.0.0.1:54329/kanban?sslmode=disable"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              type: "string"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.numeric"
            go_type:
              type: "string"
          - db_type: "timestamp"
            go_type:
              import: "time"
              type: "Time"